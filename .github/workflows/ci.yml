name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: conformance
        run: go test ./conformance/...
      - name: v0.6/1.0 acceptance (increments 1-2, must stay green)
        run: |
          go test -tags v06acceptance ./conformance/future/api
          go test -tags v06acceptance ./conformance/future/behavior
          go test -tags v06acceptance ./conformance/future/api/file
          go test -tags v06acceptance ./conformance/future/behavior/file
      - name: traceability
        run: go run ./tools/scripts/traceability-check
      - name: examples smoke
        run: go test ./examples/ -count=1
      - name: build
        run: go build ./...

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: cross-build library
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
