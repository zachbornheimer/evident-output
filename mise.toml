[tasks.setup]
description = "Bootstrap dev environment"
run = [
  "go mod download",
  "echo setup complete",
]

[tasks.build]
description = "Verify packages compile; stamp evident-output-mcp's --version so a stale host can never read the literal string 'dev'"
run = [
  "go build ./...",
  "go build -ldflags \"-X main.Version=$(git describe --tags --always --dirty)\" -o /dev/null ./cmd/evident-output-mcp",
]

[tasks.lint]
description = "Format check, vet; trunk daemonless when hermetic tools work"
run = [
  "test -z \"$(gofmt -l .)\" || { gofmt -l .; echo 'gofmt: files need formatting'; exit 1; }",
  "go vet ./...",
  # Trunk is required config-wise (--monitor=false) but hermetic tool installs can
  # fail on host/toolchain skew; never block the gate on trunk install errors.
  "if command -v trunk >/dev/null 2>&1 && [ -f .trunk/trunk.yaml ]; then trunk check --monitor=false --ci || echo 'trunk check skipped (tool install/host skew)'; fi",
]

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.test-race]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.conformance]
description = "Run roast/conformance suite"
run = "go test ./conformance/..."

[tasks.acceptance-v06]
description = """
Run the v0.6/1.0 future API and behavior acceptance suite. Increment 1
(conformance/future/api, conformance/future/behavior) is implemented and
must pass; increment 2+ (their ./pending subpackages: File/Exec/
Config.AppID/StateDir) is deliberately red-by-compile and expected nonzero
until those increments land — this target therefore does not fail CI on
its own; run acceptance-v06-increment1 for the promotion gate that must
stay green.
"""
depends = ["acceptance-v06-increment1", "acceptance-v06-pending"]

[tasks.acceptance-v06-increment1]
description = "Increment 1's future-suite fixtures — must stay green"
run = [
  "go test -tags v06acceptance ./conformance/future/api",
  "go test -tags v06acceptance ./conformance/future/behavior",
]

[tasks.acceptance-v06-pending]
description = "Increment 2+'s future-suite fixtures — expected red-by-compile until File/Exec land"
run = [
  "go test -tags v06acceptance ./conformance/future/api/pending && exit 1 || true",
  "go test -tags v06acceptance ./conformance/future/behavior/pending && exit 1 || true",
]

[tasks.fuzz]
description = "Short fuzz smoke (local)"
# internal/text now holds two fuzz targets (sanitize's FuzzText, width's
# FuzzCells, merged from internal/sanitize + internal/width) — go test -fuzz
# refuses an ambiguous pattern that matches more than one, so each runs by
# its exact name instead of the old blanket -fuzz=Fuzz.
run = [
  "go test ./internal/text/ -run=Fuzz -fuzz=FuzzText -fuzztime=5s || true",
  "go test ./internal/text/ -run=Fuzz -fuzz=FuzzCells -fuzztime=5s || true",
]

[tasks.scan]
description = "Security scan (govulncheck; installed on the fly if absent)"
run = [
  "if command -v govulncheck >/dev/null 2>&1; then govulncheck ./...; else go run golang.org/x/vuln/cmd/govulncheck@latest ./...; fi",
]

[tasks.traceability]
description = "Verify every §31 ID is listed in TRACEABILITY"
run = "go run ./tools/scripts/traceability-check"

[tasks.evo-usage-audit]
description = "Markdown evo usage inventory for another Go repo (evo-usage-audit <repo-path> [--output FILE]); put flags AFTER the task name — a flag before it is swallowed by mise's own -o/--output"
run = "go run ./tools/scripts/evo-usage-audit"

[tasks.doctor]
description = "Verify repo contract"
run = [
  "test -f mise.toml",
  "test -f go.mod",
  "test -f conformance/TRACEABILITY.md",
  "test -f conformance/schema/scenario.v1.json",
  "test -f release.go",
  "go test . -run 'PublishedRelease|VersionDrift' -count=1",
  "echo doctor ok",
]

[tasks.sync-release-pins]
description = "Rewrite portable install pins to match evo.PublishedRelease"
run = "go run ./tools/scripts/sync-release-pins"

[tasks.cut-release]
description = "Bump PublishedRelease (patch or VERSION=vX.Y.Z), sync pins, tag, push"
run = "bash tools/scripts/cut-release.sh"

[tasks.release]
description = "Full test gate then cut-release (mise run test && mise run cut-release)"
run = "mise run test && mise run cut-release"

[tasks.examples]
description = "Run example CLIs back-to-back with headers"
run = "bash tools/scripts/run-examples.sh"

[tasks.ci]
description = "Full gate: lint + test + scan + conformance + traceability"
depends = ["lint", "test", "scan", "conformance", "traceability"]

[tasks.test-evo]
description = "Capture timed PNG/TXT frames of a command in a real tmux PTY. Flags AFTER the task name. Requires --start-dir, exactly one of --timeout-ms/--timeout-s, exactly one of --screenshot-interval-ms/--screenshot-interval-s, then -- CMD"
run = "python3 ./scripts/test-evo.py"

