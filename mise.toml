[tools]
# First staticcheck build that reads Go 1.27.2 export data; return to a release pin when 2026.3 ships.
"go:honnef.co/go/tools/cmd/staticcheck" = "v0.7.0-0.dev.0.20261009230814-452d5bb86b45"
golangci-lint = "2.14.0"
gitleaks = "8.30.1"
go = "1.27.2"

[tasks.setup]
description = "Bootstrap dev environment"
run = [
  "go mod download",
  "echo setup complete",
]

[tasks.build]
description = "Verify packages compile; stamp evident-output-mcp's --version so a stale host can never read the literal string 'dev'"
run = [
  "go build ./...",
  "cd mcp && go build -ldflags \"-X main.Version=$(git describe --tags --always --dirty)\" -o /dev/null ./cmd/evident-output-mcp",
]

[tasks.lint]
description = "Format check, vet, staticcheck, golangci-lint, gitleaks over the root and mcp modules — every finding is fatal"
# mcp is its own module, so root `./...` never reaches it; the mcp lines run
# the same linters the pre-push gate runs there (golangci-lint finds the root
# .golangci.yml from the parent directory).
run = [
  "test -z \"$(gofmt -l .)\" || { gofmt -l .; echo 'gofmt: files need formatting'; exit 1; }",
  "go vet ./...",
  "cd mcp && go vet ./...",
  "staticcheck ./...",
  "cd mcp && staticcheck ./...",
  "staticcheck -tests=false -checks U1000 ./...",
  "cd mcp && staticcheck -tests=false -checks U1000 ./...",
  "golangci-lint run ./...",
  "cd mcp && golangci-lint run ./...",
  "gitleaks detect --no-git -v",
]

[tasks.test]
description = "Run all tests"
run = "go test -timeout 20m ./..."

[tasks.test-race]
description = "Run tests with race detector"
run = "go test -race -timeout 30m ./..."

[tasks.conformance]
description = "Run roast/conformance suite"
run = "go test ./conformance/..."

[tasks.fuzz]
description = "Short fuzz smoke (local)"
# FuzzText lives in internal/record (sanitization) and FuzzCells in
# internal/text (width); each runs by its exact name in its own package.
run = [
  "go test ./internal/record/ -run=Fuzz -fuzz=FuzzText -fuzztime=5s || true",
  "go test ./internal/text/ -run=Fuzz -fuzz=FuzzCells -fuzztime=5s || true",
]

[tasks.scan]
description = "Security scan (govulncheck; installed on the fly if absent)"
run = [
  "if command -v govulncheck >/dev/null 2>&1; then govulncheck ./...; else go run golang.org/x/vuln/cmd/govulncheck@latest ./...; fi",
]

[tasks.traceability]
description = "Verify every §31 ID is listed in TRACEABILITY"
run = "go run ./tools/scripts/traceability-check"

[tasks.bisectability]
description = "Prove every first-parent commit since BASE (default codex/v06-acceptance) builds and passes the tests of the packages it touched on its own — run before merging a multi-commit integration branch (the fast build-only check is the tool without --test)"
run = "go run ./tools/scripts/bisectability-check --test"

[tasks.doctor]
description = "Verify repo contract"
run = [
  "test -f mise.toml",
  "test -f go.mod",
  "test -f conformance/TRACEABILITY.md",
  "rg -q '^const Release = ' internal/project/wire/stream.go",
  "go test . -run 'PublishedRelease|VersionDrift' -count=1",
  "echo doctor ok",
]

[tasks.sync-release-pins]
description = "Rewrite portable install pins to match evo.PublishedRelease"
run = "go run ./tools/scripts/sync-release-pins"

[tasks.cut-release]
description = "Bump PublishedRelease (patch or VERSION=vX.Y.Z), sync pins, tag, push"
run = "bash tools/scripts/cut-release.sh"

[tasks.release]
description = "Full test gate then cut-release (mise run test && mise run cut-release)"
run = "mise run test && mise run cut-release"

[tasks.examples]
description = "Run example CLIs back-to-back with headers"
run = "bash tools/scripts/run-examples.sh"

[tasks.api-contract]
description = "Public API surface matches testdata/api_golden.txt plus required/retired floors"
run = "go run -C mcp ./cmd/evident-output contract --dir .."

[tasks.spec-score]
description = "Lint the spec requirement registry against CONTRACT.md"
run = "go run ./tools/scripts/spec-score --lint"

[tasks.spec-ratchet]
description = "Lint the registry and fail if any ratcheted requirement is not passing"
run = "go run ./tools/scripts/spec-score --lint --gate"

[tasks.red-proof]
description = "Each ledgered concurrency fix's guarding tests fail with the fix reverted"
run = "nice -n 10 go run ./tools/scripts/red-proof"

[tasks.ci-mcp]
description = "Build, vet, and test the mcp module so a green ci proves both modules"
dir = "mcp"
run = "go build ./... && go vet ./... && go test ./..."

[tasks.perf]
description = "Wall-time and bytes/op bounds recorded on the maintainer's machine (EVO_PERF_BASELINE=1); inside ci it waits for the other gates so their load cannot skew the timing"
env = { EVO_PERF_BASELINE = "1" }
wait_for = [
  "lint",
  "test",
  "ci-mcp",
  "scan",
  "conformance",
  "traceability",
  "api-contract",
  "spec-ratchet",
  "red-proof",
]
run = "go test . -run '^(TestGroup1kPlainWallTimeWithinTwentyPercentOfV1|TestGroup1kPlainBytesPerOpUnderV1)$' -count=1 -v"

[tasks.ci]
description = "Full local gate: ci-hosted's checks + perf (machine-specific baselines)"
depends = [
  "lint",
  "test",
  "ci-mcp",
  "scan",
  "conformance",
  "traceability",
  "api-contract",
  "spec-ratchet",
  "red-proof",
  "test-race",
  "examples",
  "perf",
]

[tasks.ci-hosted]
description = "ci without perf: what a CI runner can prove (its hardware is not the baseline's); GitHub Actions runs exactly this"
depends = [
  "lint",
  "test",
  "ci-mcp",
  "scan",
  "conformance",
  "traceability",
  "api-contract",
  "spec-ratchet",
  "red-proof",
  "test-race",
  "examples",
]

[tasks.verify-quiet-pty-stream]
description = "Prove a quiet Writer task keeps its live frame changing <100ms, measured from the pty byte stream (no tmux)"
run = "uv run ./tools/verify-quiet-pty-stream.py"

[tasks.test-evo]
description = "Capture timed PNG/TXT frames of a command in a real tmux PTY. Flags AFTER the task name. Requires --start-dir, exactly one of --timeout-ms/--timeout-s, exactly one of --screenshot-interval-ms/--screenshot-interval-s, then -- CMD"
run = "uv run ./tools/test-evo.py"
