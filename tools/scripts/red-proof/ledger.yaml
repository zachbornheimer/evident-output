# Round-1/2 concurrency fixes and the tests that must fail without each one.
# `go run ./tools/scripts/red-proof` (mise run red-proof) replays every entry:
# it reverts the commit's non-test hunks in a scratch copy of HEAD and requires
# every named test to fail there. An entry whose later edits keep its hunks from
# reversing names a hand-written `revert:` patch that re-introduces the bug in
# HEAD instead. Fixed YAML subset; see ledger.go.
entries:
  - commit: ddbd70f3
    note: ring onAppend runs outside the ring lock (Resolve/ring lock-order deadlock)
    tests:
      - pkg: ./internal/graph
        name: TestRingOnAppendNeverDeadlocksResolve
      - pkg: ./internal/process
        name: TestRingCallsOnAppendOutsideItsLock
  - commit: d4965643
    note: barrier gates open and settle outside outputsMu
    tests:
      - pkg: ./internal/change
        name: TestBarrierCallsRunOutsideOutputsLock
  - commit: 852ea4b8
    note: dry run marks the basis of planned changes uncertain (freshness Plan)
    revert: patches/852ea4b8.patch
    tests:
      - pkg: .
        name: TestDryRunPlansDownstreamOfPlannedOutputs
  - commit: 8c9f44b6
    note: excluded members fold into the container outcome; NotStarted names its stopper
    revert: patches/8c9f44b6.patch
    tests:
      - pkg: .
        name: TestAfterGroupProceedsWhenAMemberIsExcluded
      - pkg: .
        name: TestNotStartedNamesItsPredecessorWithOneSpelling
  - commit: f0d90673
    note: payload on a shared tty is written above the live region
    revert: patches/f0d90673.patch
    tests:
      - pkg: .
        name: TestResultWriterPayloadSurvivesSharedTerminal
